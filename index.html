<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimani kutgandin?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .title {
            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.8);
            color: #fff;

            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
        }

        .image-wrapper {
            width: 100%;
            height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        .image-wrapper img {
            display: block;

            max-width: 100%;
            max-height: 100%;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;
        }

        @media (max-width: 600px) {
            .title {
                height: 60px;
                font-size: 24px;
                letter-spacing: 1px;
            }

            .image-wrapper {
                height: calc(100vh - 60px);
            }
        }
    </style>
</head>

<body>

    <div class="title">
        NIMANI KUTGANDIN?
    </div>

    <div class="image-wrapper">
        <img src="IMG_2650.jpeg" alt="meme rasmi">
    </div>

</body>
</html>
